<style>

<script>
/* ============================================================
   Nerva — encargos, señas y caja
   Funciona 100% offline (localStorage). La sincronización entre
   celulares se activa desde Ajustes pegando la config de Firebase.
   ============================================================ */

const RESINAS = ['Negra','Marrón','Ámbar','Azul','Transparente','Blanca','Verde'];
const METODOS = { efectivo:'Efectivo', transferencia:'Transferencia' };
const CAT_SALIDA  = ['Madera','Resina','Insumos','Herramientas','Envíos','Publicidad','Otros'];
const CAT_ENTRADA = ['Venta directa','Otro ingreso'];

/* Un encargo pasa por el taller: se toma, se trabaja, queda listo y se entrega. */
const ESTADOS = {
  pendiente: { txt:'Sin empezar', cls:'bg-stone-500/15 text-stone-300 border-stone-500/30', next:'proceso',   accion:'Empezar' },
  proceso:   { txt:'En proceso',  cls:'bg-mad-500/15 text-mad-300 border-mad-500/35',       next:'listo',     accion:'Está listo' },
  listo:     { txt:'Listo',       cls:'bg-sky-400/15 text-sky-300 border-sky-400/35',       next:'entregado', accion:'Entregar' },
  entregado: { txt:'Entregado',   cls:'bg-ok/15 text-ok border-ok/30',                      next:null,        accion:null },
  cancelado: { txt:'Cancelado',   cls:'bg-bad/15 text-bad border-bad/30',                   next:null,        accion:null }
};
const ACTIVOS = ['pendiente','proceso','listo'];

/* ---------- estado en memoria ---------- */
const COLS = ['encargos','movs','productos'];
let DATA  = { encargos:[], movs:[], productos:[] };
let CFG   = { negocioId:'', fb:null };
let UI    = { tab:'encargos', filtro:'activos', q:'', mes:null, borrador:null, original:null, pg:null };
let CLOUD = { on:false, db:null, fns:null, unsubs:[], error:null, arrancada:{} };

/* ---------- helpers ---------- */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (n < 0 ? '−$' : '$') + Math.abs(Math.round(Number(n) || 0)).toLocaleString('es-UY');
const pad = n => String(n).padStart(2, '0');
const clone = o => JSON.parse(JSON.stringify(o));
const soloNum = v => Number(String(v == null ? '' : v).replace(/[^\d]/g, '')) || 0;

const isoDe = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hoyISO = () => isoDe(new Date());
const mesActual = () => hoyISO().slice(0, 7);
const fechaDe = iso => { const p = iso.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const DIAS  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIASC = ['dom','lun','mar','mié','jue','vie','sáb'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fechaCorta = iso => { if(!iso) return ''; const f = fechaDe(iso); return DIASC[f.getDay()] + ' ' + f.getDate() + '/' + pad(f.getMonth() + 1); };
const fechaLarga = iso => { if(!iso) return ''; const f = fechaDe(iso); return DIAS[f.getDay()] + ' ' + f.getDate() + '/' + pad(f.getMonth() + 1); };
const mesLabel = m => { const p = m.split('-'); return MESES[Number(p[1]) - 1] + ' ' + p[0]; };
function diasHasta(iso){
  const h = new Date(); h.setHours(0,0,0,0);
  return Math.round((fechaDe(iso) - h) / 864e5);
}

function toast(msg){
  DESHACER = null;
  $('#toastMsg').textContent = msg;
  $('#toast').classList.remove('hidden');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => $('#toast').classList.add('hidden'), 2200);
}

/* Borrar es irreversible y, con la sincronización activa, borra para todos a la vez.
   Por eso cada borrado deja unos segundos para arrepentirse. */
let DESHACER = null;
function toastDeshacer(msg, alDeshacer){
  DESHACER = alDeshacer;
  $('#toastMsg').innerHTML = esc(msg) +
    ' <button id="btnDeshacer" class="ml-2 font-black text-mad-600 underline underline-offset-2 pointer-events-auto">Deshacer</button>';
  $('#toast').classList.remove('hidden');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { $('#toast').classList.add('hidden'); DESHACER = null; }, 7000);
}

/* ---------- persistencia local ---------- */
const K = k => 'nerva:' + k;

function loadLocal(){
  try {
    COLS.forEach(c => DATA[c] = JSON.parse(localStorage.getItem(K(c)) || '[]'));
    CFG = Object.assign(CFG, JSON.parse(localStorage.getItem(K('config')) || '{}'));
  } catch(e){ console.warn('No se pudo leer el almacenamiento local', e); }
}

function saveLocal(col){
  try {
    if(col === 'config') localStorage.setItem(K('config'), JSON.stringify(CFG));
    else localStorage.setItem(K(col), JSON.stringify(DATA[col]));
  } catch(e){ console.warn('No se pudo guardar', e); }
}

/* Escribe un registro: local siempre, y en la nube si está conectada. */
function putDoc(col, obj, sinRender){
  obj.upd = Date.now();
  const i = DATA[col].findIndex(x => x.id === obj.id);
  if(i >= 0) DATA[col][i] = obj; else DATA[col].push(obj);
  saveLocal(col);
  if(CLOUD.on) cloudPut(col, obj);
  if(!sinRender) render();
}

function delDoc(col, id, sinRender){
  DATA[col] = DATA[col].filter(x => x.id !== id);
  saveLocal(col);
  if(CLOUD.on) cloudDel(col, id);
  if(!sinRender) render();
}

/* ---------- consultas ---------- */
const productosOn = () => DATA.productos.filter(p => p.activo !== false).sort((a,b) => (a.orden||0) - (b.orden||0) || a.nombre.localeCompare(b.nombre));
const pagosDe = id => DATA.movs.filter(m => m.encargoId === id && m.tipo === 'entrada').sort((a,b) => (a.fecha||'').localeCompare(b.fecha||'') || a.ts - b.ts);
const totalEnc = e => (e.items || []).reduce((s,i) => s + (Number(i.precio) || 0) * (Number(i.cant) || 0), 0);
const proximoNum = () => DATA.encargos.reduce((m,e) => Math.max(m, e.num || 0), 0) + 1;

/* Cuánto vale, cuánto se pagó y cuánto falta. "pagos" permite calcularlo sobre el
   borrador del editor, que todavía no se guardó. */
function cuentaEnc(e, pagos){
  const total  = totalEnc(e);
  const pagado = (pagos || pagosDe(e.id)).reduce((s,m) => s + (Number(m.monto) || 0), 0);
  const saldo  = Math.max(0, total - pagado);
  let estado;
  if(total <= 0)          estado = pagado > 0 ? 'senado' : 'sinprecio';
  else if(pagado <= 0)    estado = 'sinsena';
  else if(pagado >= total) estado = 'pagado';
  else                    estado = 'senado';
  return { total, pagado, saldo, estado, deMas: Math.max(0, pagado - total) };
}

/* Cómo se llama un pago según lo que ya se había pagado antes. */
function categoriaPago(total, antes, monto){
  const despues = antes + monto;
  if(antes <= 0) return (total > 0 && despues >= total) ? 'Pago total' : 'Seña';
  return (total > 0 && despues >= total) ? 'Saldo' : 'A cuenta';
}

function resumenEncargos(){
  const vivos = DATA.encargos.filter(e => e.estado !== 'cancelado');
  const activos = vivos.filter(e => ACTIVOS.includes(e.estado));
  let porCobrar = 0, deudores = 0, senas = 0, atrasados = 0, semana = 0;
  vivos.forEach(e => {
    const c = cuentaEnc(e);
    if(c.saldo > 0){ porCobrar += c.saldo; deudores++; }
    if(ACTIVOS.includes(e.estado)){
      senas += c.pagado;
      if(e.fechaEntrega){
        const d = diasHasta(e.fechaEntrega);
        if(d < 0) atrasados++; else if(d <= 7) semana++;
      }
    }
  });
  return { activos: activos.length, porCobrar, deudores, senas, atrasados, semana };
}

function clientesConocidos(){
  const m = new Map();
  DATA.encargos.slice().sort((a,b) => b.ts - a.ts).forEach(e => {
    const k = (e.cliente || '').trim().toLowerCase();
    if(k && !m.has(k)) m.set(k, { cliente:e.cliente.trim(), tel:e.tel || '', dir:e.dir || '' });
  });
  return Array.from(m.values());
}

function nombresDePiezas(){
  const s = new Set(productosOn().map(p => p.nombre));
  DATA.encargos.forEach(e => (e.items || []).forEach(i => { if(i.nombre) s.add(i.nombre.trim()); }));
  return Array.from(s).sort((a,b) => a.localeCompare(b));
}

/* ---------- WhatsApp ---------- */
function telWa(t){
  let d = String(t || '').replace(/\D/g, '');
  if(!d) return '';
  if(d.indexOf('598') === 0 && d.length >= 11) return d;
  if(d[0] === '0') d = d.slice(1);
  return d.length === 8 ? '598' + d : d;
}
/* En la compu, wa.me abre una página intermedia que pide permisos: ahí va directo
   a WhatsApp Web, siempre en la misma pestaña. */
function linkWa(tel, texto){
  const n = telWa(tel);
  const escritorio = window.matchMedia('(pointer:fine)').matches && window.innerWidth >= 1024;
  if(escritorio) return 'https://web.whatsapp.com/send?' + (n ? 'phone=' + n + '&' : '') + 'text=' + encodeURIComponent(texto);
  return 'https://wa.me/' + n + '?text=' + encodeURIComponent(texto);
}
const primerNombre = s => String(s || '').trim().split(/\s+/)[0] || '';

function descItem(i){
  const det = [i.medida, i.resina ? 'resina ' + i.resina.toLowerCase() : '', i.grabado ? 'grabado "' + i.grabado + '"' : ''].filter(Boolean).join(' · ');
  return (i.cant > 1 ? i.cant + '× ' : '') + (i.nombre || 'Pieza') + (det ? ' (' + det + ')' : '');
}

function textoComprobante(e, pagos){
  const c = cuentaEnc(e, pagos);
  const ps = pagos || pagosDe(e.id);
  const l = ['NERVA · Más que madera...', '', 'Encargo #' + e.num + ' — ' + (e.cliente || '')];
  (e.items || []).forEach(i => l.push('• ' + descItem(i) + (i.precio ? ' — ' + money(i.precio * i.cant) : '')));
  if(c.total) l.push('', 'Total: ' + money(c.total));
  ps.forEach(p => l.push(p.cat + ': ' + money(p.monto) + ' (' + (METODOS[p.metodo] || p.metodo).toLowerCase() + ', ' + fechaCorta(p.fecha) + ')'));
  if(c.total) l.push(c.saldo > 0 ? 'Saldo a pagar: ' + money(c.saldo) : 'Pago completo ✔');
  if(e.fechaEntrega) l.push('Entrega: ' + fechaLarga(e.fechaEntrega) + (e.entrega === 'envio' ? ' · envío' : ' · retira'));
  l.push('', '¡Gracias por elegirnos!');
  return l.join('\n');
}

function textoListo(e){
  const c = cuentaEnc(e);
  return '¡Hola ' + primerNombre(e.cliente) + '! Te aviso que tu encargo de Nerva ya está pronto. ' +
    (c.saldo > 0 ? 'Queda un saldo de ' + money(c.saldo) + '. ' : '') +
    (e.entrega === 'envio' ? '¿Cuándo te queda bien que te lo llevemos?' : '¿Cuándo te queda bien para retirarlo?');
}

function compartir(txt){
  if(navigator.share){ navigator.share({ text:txt }).catch(() => {}); return; }
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast('Copiado: pegalo donde quieras'), () => toast('No se pudo copiar'));
  else toast('Tu navegador no permite compartir');
}

function tile(label, valor, extra, claseValor){

    (extra ? '<p class="text-[10px] text-stone-500 leading-tight mt-0.5">' + esc(extra) + '</p>' : '') +

function vacio(txt, sub){

/* ---------------------------- ENCARGOS ---------------------------- */

const FILTROS = [
  { id:'activos',   txt:'Activos',     f:e => ACTIVOS.includes(e.estado) },
  { id:'pendiente', txt:'Sin empezar', f:e => e.estado === 'pendiente' },
  { id:'proceso',   txt:'En proceso',  f:e => e.estado === 'proceso' },
  { id:'listo',     txt:'Listos',      f:e => e.estado === 'listo' },
  { id:'saldo',     txt:'Deben plata', f:e => e.estado !== 'cancelado' && cuentaEnc(e).saldo > 0 },
  { id:'entregado', txt:'Entregados',  f:e => e.estado === 'entregado' },
  { id:'todos',     txt:'Todos',       f:e => true }
];

function coincide(e, q){
  if(!q) return true;
  q = q.toLowerCase().trim();
  const hay = ['#' + e.num, e.cliente, e.tel, e.notas].concat((e.items || []).map(i => i.nombre + ' ' + (i.grabado || '')))
    .join(' ').toLowerCase();
  return hay.indexOf(q) >= 0;
}

/* Los activos se ordenan por fecha de entrega (lo más urgente arriba); los
   entregados, del último al primero. */
function ordenar(lista){
  if(UI.filtro === 'entregado') return lista.sort((a,b) => (b.tsEntrega || b.ts) - (a.tsEntrega || a.ts));
  if(UI.filtro === 'todos') return lista.sort((a,b) => b.num - a.num);
  return lista.sort((a,b) => {
    const fa = a.fechaEntrega || '9999', fb = b.fechaEntrega || '9999';
    return fa.localeCompare(fb) || a.num - b.num;
  });
}

function renderEncargos(){
  const r = resumenEncargos();
  $('#resumenEnc').innerHTML =
    tile('Activos', String(r.activos), r.atrasados ? r.atrasados + (r.atrasados === 1 ? ' atrasado' : ' atrasados') : (r.semana ? r.semana + ' para esta semana' : 'en el taller'), r.atrasados ? 'text-bad' : '') +
    tile('Señas', money(r.senas), 'de lo que falta entregar') +
    tile('Por cobrar', money(r.porCobrar), r.deudores ? r.deudores + (r.deudores === 1 ? ' encargo' : ' encargos') : 'nadie debe nada', r.porCobrar ? 'text-mad-300' : '');

  $('#filtros').innerHTML = FILTROS.map(f => {
    const n = DATA.encargos.filter(f.f).length;
    const on = UI.filtro === f.id;
    return '<button data-filtro="' + f.id + '" class="chip shrink-0 ' + (on ? 'on' : '') + '">' +
      esc(f.txt) + (n ? ' <span class="opacity-60">' + n + '</span>' : '') + '</button>';
  }).join('');

  renderListaEnc();
}

function renderListaEnc(){
  const filtro = FILTROS.find(f => f.id === UI.filtro) || FILTROS[0];
  const lista = ordenar(DATA.encargos.filter(filtro.f).filter(e => coincide(e, UI.q)));
  if(!lista.length){
    $('#listaEnc').innerHTML = UI.q ? vacio('No hay encargos que coincidan con "' + UI.q + '"')
      : !DATA.encargos.length ? vacio('Todavía no hay encargos', 'Tocá "Encargo" para anotar el primero: quién, qué pieza, para cuándo y cuánto dejó de seña.')
      : vacio('No hay encargos en "' + filtro.txt + '"');
    return;
  }
  $('#listaEnc').innerHTML = lista.map(cardEncargo).join('');
}

function chipFecha(e){
  if(!e.fechaEntrega) return '<span class="text-stone-500">Sin fecha de entrega</span>';
  let txt = fechaCorta(e.fechaEntrega), cls = 'text-stone-300';
  if(ACTIVOS.includes(e.estado)){
    const d = diasHasta(e.fechaEntrega);
    if(d < 0){ txt += ' · atrasado ' + (-d) + (d === -1 ? ' día' : ' días'); cls = 'text-bad font-bold'; }
    else if(d === 0){ txt += ' · es hoy'; cls = 'text-warn font-bold'; }
    else if(d === 1){ txt += ' · mañana'; cls = 'text-warn font-bold'; }
    else if(d <= 7){ txt += ' · en ' + d + ' días'; cls = 'text-mad-300'; }
  }
  return '<span class="' + cls + '">' + esc(txt) + '</span>';
}

function barraPago(c){
  const pct = c.total > 0 ? Math.min(100, Math.round(c.pagado / c.total * 100)) : (c.pagado > 0 ? 100 : 0);
  const color = c.estado === 'pagado' ? 'bg-ok' : 'bg-gradient-to-r from-mad-600 to-oro';
  let txt;
  if(c.estado === 'sinprecio') txt = '<span class="text-stone-500">Precio sin definir</span>';
  else if(c.estado === 'sinsena') txt = '<span class="text-warn font-bold">Sin seña</span> <span class="text-stone-400">· total ' + money(c.total) + '</span>';
  else if(c.estado === 'pagado') txt = '<span class="text-ok font-bold">Pagado ✔</span> <span class="text-stone-400">' + money(c.total) + (c.deMas ? ' · ' + money(c.deMas) + ' de más' : '') + '</span>';
  else if(c.total <= 0) txt = '<span class="text-mad-300 font-bold">Seña ' + money(c.pagado) + '</span> <span class="text-stone-400">· precio sin definir</span>';
  else txt = '<span class="text-mad-300 font-bold">Señado ' + money(c.pagado) + '</span> <span class="text-stone-400">de ' + money(c.total) + ' · faltan </span><span class="font-bold text-stone-100">' + money(c.saldo) + '</span>';
  return '<div class="mt-2.5">' +
    '<div class="h-1.5 rounded-full bg-nog-600 overflow-hidden"><div class="h-full ' + color + '" style="width:' + pct + '%"></div></div>' +
    '<p class="text-[12px] mt-1.5 tabular">' + txt + '</p>' +
  '</div>';
}

function cardEncargo(e){
  const est = ESTADOS[e.estado] || ESTADOS.pendiente;
  const c = cuentaEnc(e);
  const items = e.items || [];
  const lineas = items.slice(0, 3).map(i => {
    const det = [i.medida, i.resina ? 'resina ' + i.resina.toLowerCase() : '', i.grabado ? 'grabado "' + i.grabado + '"' : ''].filter(Boolean).join(' · ');
    return '<p class="text-[14px] text-stone-100 leading-snug">' + (i.cant > 1 ? '<span class="font-bold text-mad-300">' + i.cant + '×</span> ' : '') + esc(i.nombre || 'Pieza') + '</p>' +
      (det ? '<p class="text-[12px] text-stone-400 leading-snug truncate">' + esc(det) + '</p>' : '');
  }).join('') +
    (items.length > 3 ? '<p class="text-[11px] text-stone-500">+' + (items.length - 3) + ' más</p>' : '') +
    (!items.length && e.notas ? '<p class="text-[13px] text-stone-300 leading-snug line-clamp-2">' + esc(e.notas) + '</p>' : '');

  let acciones = '';
  if(est.next){
    acciones += '<button data-avanzar="' + e.id + '" class="flex-1 py-2.5 rounded-xl font-extrabold text-sm active:scale-[.98] transition ' +
      (e.estado === 'listo' ? 'bg-mad-500 text-nog-900 hover:bg-mad-400' : 'bg-nog-700 border border-nog-600 text-stone-100 hover:bg-nog-600') + '">' + est.accion + '</button>';
  }
  if(e.estado === 'listo' && e.tel){
    acciones += '<a href="' + esc(linkWa(e.tel, textoListo(e))) + '" target="whatsapp" rel="noopener" class="px-3.5 py-2.5 rounded-xl border border-ok/40 text-ok font-bold text-sm active:bg-ok/10 hover:bg-ok/10">Avisar</a>';
  }
  if(e.estado === 'entregado' && c.saldo > 0){
    acciones += '<button data-cobrar="' + e.id + '" class="flex-1 py-2.5 rounded-xl bg-mad-500 text-nog-900 font-extrabold text-sm active:scale-[.98] transition">Cobrar saldo ' + money(c.saldo) + '</button>';
  }

  return '<div data-enc="' + e.id + '" class="card p-3.5 cursor-pointer hover:border-nog-500 transition ' + (e.estado === 'cancelado' ? 'opacity-50' : '') + '">' +
    '<div class="flex items-start gap-2">' +
      '<span class="text-[12px] font-bold text-stone-500 tabular mt-0.5">#' + e.num + '</span>' +
      '<p class="flex-1 min-w-0 font-bold text-[15px] leading-tight truncate">' + esc(e.cliente || 'Sin nombre') + '</p>' +
      '<span class="shrink-0 text-[11px] font-bold px-2 py-0.5 rounded-full border ' + est.cls + '">' + est.txt + '</span>' +
    '</div>' +
    '<div class="mt-2 space-y-0.5">' + lineas + '</div>' +
    '<div class="mt-2 flex items-center gap-2 text-[12px]">' +
      '<svg viewBox="0 0 24 24" class="w-3.5 h-3.5 text-stone-500 shrink-0" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>' +
      chipFecha(e) +
      '<span class="ml-auto text-stone-500">' + (e.entrega === 'envio' ? 'Envío' : 'Retira') + '</span>' +
    '</div>' +
    barraPago(c) +
    (acciones ? '<div class="mt-3 flex gap-2">' + acciones + '</div>' : '') +
  '</div>';
}

/* ---------------------------- CAJA ---------------------------- */

function mesesConDatos(){
  const s = new Set(DATA.movs.map(m => (m.fecha || '').slice(0, 7)).filter(Boolean));
  s.add(mesActual());
  return Array.from(s).sort().reverse();
}

function resumenMovs(ms){
  const r = { ent:0, sal:0, ef:0, tr:0, efE:0, efS:0, trE:0, trS:0, porCatS:{}, porCatE:{} };
  ms.forEach(m => {
    const v = Number(m.monto) || 0;
    const entra = m.tipo === 'entrada';
    if(entra){ r.ent += v; r.porCatE[m.cat || 'Otro ingreso'] = (r.porCatE[m.cat || 'Otro ingreso'] || 0) + v; }
    else     { r.sal += v; r.porCatS[m.cat || 'Otros'] = (r.porCatS[m.cat || 'Otros'] || 0) + v; }
    if(m.metodo === 'efectivo'){ entra ? r.efE += v : r.efS += v; }
    else                       { entra ? r.trE += v : r.trS += v; }
  });
  r.neto = r.ent - r.sal;
  r.ef = r.efE - r.efS;
  r.tr = r.trE - r.trS;
  return r;
}

function barras(obj, total, color){
  const filas = Object.keys(obj).map(k => ({ k, v:obj[k] })).sort((a,b) => b.v - a.v);
  if(!filas.length) return '<p class="text-[12px] text-stone-500">Nada cargado este mes.</p>';
  return filas.map(f => {
    const pct = total ? Math.max(2, Math.round(f.v / total * 100)) : 0;
    return '<div class="py-1.5">' +
      '<div class="flex justify-between text-[13px]"><span class="text-stone-200">' + esc(f.k) + '</span><span class="tabular font-bold">' + money(f.v) + '</span></div>' +
      '<div class="h-1.5 rounded-full bg-nog-700 mt-1 overflow-hidden"><div class="h-full ' + color + '" style="width:' + pct + '%"></div></div>' +
    '</div>';
  }).join('');
}

function filaMov(m){
  const entra = m.tipo === 'entrada';
  const enc = m.encargoId ? DATA.encargos.find(e => e.id === m.encargoId) : null;
  const concepto = enc ? 'Encargo #' + enc.num + ' · ' + enc.cliente : (m.concepto || m.cat || '—');
  return '<button data-mov="' + m.id + '" class="w-full flex items-center gap-3 px-3.5 py-2.5 text-left hover:bg-nog-700/50 active:bg-nog-700">' +
    '<span class="w-8 h-8 shrink-0 rounded-full grid place-items-center text-base font-black ' + (entra ? 'bg-ok/15 text-ok' : 'bg-bad/15 text-bad') + '">' + (entra ? '+' : '−') + '</span>' +
    '<span class="flex-1 min-w-0">' +
      '<span class="block text-[14px] font-semibold truncate">' + esc(concepto) + '</span>' +
      '<span class="block text-[11px] text-stone-500">' + esc(m.cat || (entra ? 'Entrada' : 'Gasto')) + ' · ' + esc(METODOS[m.metodo] || '—') + '</span>' +
    '</span>' +
    '<span class="tabular font-bold text-[14px] ' + (entra ? 'text-ok' : 'text-stone-200') + '">' + (entra ? '+' : '−') + money(m.monto) + '</span>' +
  '</button>';
}

function renderCaja(){
  const meses = mesesConDatos();
  if(!UI.mes || meses.indexOf(UI.mes) < 0) UI.mes = meses[0];
  $('#selMes').innerHTML = meses.map(m => '<option value="' + m + '"' + (m === UI.mes ? ' selected' : '') + '>' + mesLabel(m) + (m === mesActual() ? ' (este mes)' : '') + '</option>').join('');

  const ms = DATA.movs.filter(m => (m.fecha || '').slice(0, 7) === UI.mes);
  const r = resumenMovs(ms);
  const tot = resumenMovs(DATA.movs);
  const enc = resumenEncargos();

  /* movimientos agrupados por día, del más nuevo al más viejo */
  const porDia = {};
  ms.forEach(m => { (porDia[m.fecha] = porDia[m.fecha] || []).push(m); });
  const dias = Object.keys(porDia).sort().reverse();
  const listaMovs = dias.length
    ? dias.map(d => {
        const del = porDia[d].sort((a,b) => b.ts - a.ts);
        const rr = resumenMovs(del);
        return '<div>' +
          '<div class="px-3.5 pt-3 pb-1 flex justify-between text-[11px] uppercase tracking-wide font-bold text-stone-500"><span>' + esc(fechaLarga(d)) + (d === hoyISO() ? ' · hoy' : '') + '</span><span class="tabular">' + (rr.neto >= 0 ? '+' : '') + money(rr.neto) + '</span></div>' +
          del.map(filaMov).join('') +
        '</div>';
      }).join('')
    : '<p class="px-3.5 py-8 text-center text-[13px] text-stone-500">No hay movimientos en ' + esc(mesLabel(UI.mes)) + '.<br>Las señas y saldos de los encargos aparecen acá solos.</p>';

  $('#cajaBody').innerHTML =
    '<div class="lg:col-span-2 grid grid-cols-3 gap-2">' +
      tile('Entradas', money(r.ent), ms.filter(m => m.tipo === 'entrada').length + ' movimientos', 'text-ok') +
      tile('Salidas', money(r.sal), ms.filter(m => m.tipo !== 'entrada').length + ' gastos', 'text-bad') +
      tile('Resultado', money(r.neto), mesLabel(UI.mes), r.neto >= 0 ? 'text-mad-200' : 'text-bad') +
    '</div>' +

    '<div class="space-y-3">' +
      '<div class="card p-3.5">' +
        '<p class="lbl">Encargos</p>' +
        '<div class="grid grid-cols-2 gap-3">' +
          '<div><p class="text-[11px] text-stone-400">Por cobrar</p><p class="text-xl font-extrabold tabular text-mad-300">' + money(enc.porCobrar) + '</p><p class="text-[11px] text-stone-500">' + enc.deudores + (enc.deudores === 1 ? ' encargo con saldo' : ' encargos con saldo') + '</p></div>' +
          '<div><p class="text-[11px] text-stone-400">Señas en mano</p><p class="text-xl font-extrabold tabular">' + money(enc.senas) + '</p><p class="text-[11px] text-stone-500">de encargos sin entregar</p></div>' +
        '</div>' +
        '<p class="text-[11px] text-stone-500 mt-2.5 leading-snug">Las señas ya están contadas en la caja, pero esas piezas todavía hay que hacerlas y entregarlas.</p>' +
      '</div>' +

      '<div class="card p-3.5">' +
        '<p class="lbl">Por medio de pago · ' + esc(mesLabel(UI.mes)) + '</p>' +
        '<div class="grid grid-cols-2 gap-3 text-[13px]">' +
          '<div><p class="text-stone-400 text-[11px]">Efectivo</p><p class="text-lg font-extrabold tabular">' + money(r.ef) + '</p><p class="text-[11px] text-stone-500 tabular">+' + money(r.efE) + ' / −' + money(r.efS) + '</p></div>' +
          '<div><p class="text-stone-400 text-[11px]">Transferencia</p><p class="text-lg font-extrabold tabular">' + money(r.tr) + '</p><p class="text-[11px] text-stone-500 tabular">+' + money(r.trE) + ' / −' + money(r.trS) + '</p></div>' +
        '</div>' +
      '</div>' +

      '<div class="card p-3.5"><p class="lbl">Gastos por rubro</p>' + barras(r.porCatS, r.sal, 'bg-bad/70') + '</div>' +
      '<div class="card p-3.5"><p class="lbl">Entradas por tipo</p>' + barras(r.porCatE, r.ent, 'bg-ok/70') + '</div>' +

      '<div class="card p-3.5">' +
        '<p class="lbl">Acumulado desde el primer registro</p>' +
        '<div class="grid grid-cols-3 gap-2 text-[13px]">' +
          '<div><p class="text-stone-400 text-[11px]">Efectivo</p><p class="font-extrabold tabular">' + money(tot.ef) + '</p></div>' +
          '<div><p class="text-stone-400 text-[11px]">Transferencia</p><p class="font-extrabold tabular">' + money(tot.tr) + '</p></div>' +
          '<div><p class="text-stone-400 text-[11px]">Total</p><p class="font-extrabold tabular text-mad-200">' + money(tot.neto) + '</p></div>' +
        '</div>' +
      '</div>' +
      '<button id="btnCompartirMes" class="w-full py-2.5 rounded-xl border border-nog-600 font-bold text-sm text-stone-300 active:bg-nog-700 hover:bg-nog-700">Compartir resumen de ' + esc(mesLabel(UI.mes)) + '</button>' +
    '</div>' +

    '<div class="card overflow-hidden pb-1">' +
      '<p class="lbl px-3.5 pt-3.5 mb-0">Movimientos</p>' + listaMovs +
    '</div>';
}

function textoResumenMes(mes){
  const ms = DATA.movs.filter(m => (m.fecha || '').slice(0, 7) === mes);
  const r = resumenMovs(ms);
  const enc = resumenEncargos();
  const l = ['NERVA · Caja de ' + mesLabel(mes), '',
    'Entradas: ' + money(r.ent), 'Salidas: ' + money(r.sal), 'Resultado: ' + money(r.neto), '',
    'Efectivo: ' + money(r.ef) + ' · Transferencia: ' + money(r.tr)];
  const gastos = Object.keys(r.porCatS).sort((a,b) => r.porCatS[b] - r.porCatS[a]);
  if(gastos.length){ l.push('', 'Gastos:'); gastos.forEach(k => l.push('• ' + k + ': ' + money(r.porCatS[k]))); }
  l.push('', 'Por cobrar de encargos: ' + money(enc.porCobrar));
  return l.join('\n');
}

/* ---------------------------- PRODUCTOS ---------------------------- */

  $('#listaProd').innerHTML = ps.map(p =>

        '<p class="flex-1 font-bold text-[15px] leading-tight">' + esc(p.nombre) + '</p>' +

function abrirSheet(titulo, html, chico){
  clearTimeout(toast._t); $('#toast').classList.add('hidden'); DESHACER = null;
  $('#sheetTitle').textContent = titulo;
  $('#sheetBody').innerHTML = html;
  $('#sheet').classList.toggle('chico', !!chico);
  $('#overlay').classList.remove('hidden');
  $('#sheet').classList.remove('hidden');
  $('#sheet').scrollTop = 0;
  requestAnimationFrame(() => $('#sheet').classList.remove('down'));
}

function hayCambiosSinGuardar(){
  if(!UI.borrador) return false;
  return JSON.stringify(UI.borrador) !== UI.original || (UI.pg && soloNum(UI.pg.monto) > 0);
}

function cerrarSheet(forzar){
  if(!forzar && hayCambiosSinGuardar() && !confirm('¿Cerrar sin guardar los cambios del encargo?')) return;
  $('#sheet').classList.add('down');
  $('#overlay').classList.add('hidden');
  setTimeout(() => $('#sheet').classList.add('hidden'), 220);
  UI.borrador = null; UI.original = null; UI.pg = null; UI.mov = null;
}

function chips(lista, actual, attr, extra){
  return lista.map(x => {
    const id = typeof x === 'string' ? x : x.id;
    const txt = typeof x === 'string' ? x : x.txt;
    return '<button type="button" data-' + attr + '="' + esc((extra != null ? extra + '|' : '') + id) + '" class="chip ' + (id === actual ? 'on' : '') + '">' + esc(txt) + '</button>';
  }).join('');
}

function addPieza(prod){
  const b = UI.borrador;
  const it = itemNuevo();
  if(prod){ it.nombre = prod.nombre; it.precio = Number(prod.precio) || 0; }
  /* Si la última pieza está vacía, se completa esa en vez de agregar otra. */
  const ult = b.items[b.items.length - 1];
  if(prod && ult && !ult.nombre.trim() && !ult.precio) b.items[b.items.length - 1] = it;
  else b.items.push(it);
  pintarItems(); pintarCuenta();
  if(!prod){
    const ins = $$('[data-it$="|nombre"]');
    if(ins.length) ins[ins.length - 1].focus();
  }
}

/* Devuelve false si falta algo para poder agregar el pago. */
function agregarPagoBorrador(){
  const b = UI.borrador, pg = UI.pg;
  const monto = soloNum(pg.monto);
  if(!monto){ toast('Poné el monto del pago'); return false; }
  if(!pg.metodo){ toast('Elegí si fue en efectivo o por transferencia'); return false; }
  const c = cuentaEnc(b, b.pagos);
  b.pagos.push({ id:uid(), tipo:'entrada', monto:monto, metodo:pg.metodo, fecha:pg.fecha || hoyISO(), ts:Date.now(),
                 cat:categoriaPago(c.total, c.pagado, monto), encargoId:b.id });
  UI.pg = { monto:'', metodo:'', fecha:hoyISO() };
  pintarCuenta();
  return true;
}

function guardarEncargo(){
  const b = UI.borrador;
  b.cliente = (b.cliente || '').trim();
  if(!b.cliente){ toast('Poné el nombre del cliente'); $('#enCliente').focus(); return; }
  /* Un pago escrito pero sin "Agregar" se agrega solo: es lo que uno espera al guardar. */
  if(soloNum(UI.pg.monto) > 0 && !agregarPagoBorrador()) return;
  b.items = b.items.filter(i => (i.nombre || '').trim() || Number(i.precio));
  b.items.forEach(i => { i.nombre = (i.nombre || '').trim(); i.cant = Number(i.cant) || 1; i.precio = Number(i.precio) || 0; });
  if(b.entrega !== 'envio') b.dir = b.dir || '';
  if(b.estado === 'entregado' && !b.tsEntrega) b.tsEntrega = Date.now();

  const pagos = b.pagos;
  const enc = clone(b); delete enc.pagos;
  const concepto = 'Encargo #' + enc.num + ' · ' + enc.cliente;
  const antes = pagosDe(enc.id);
  antes.filter(m => !pagos.find(p => p.id === m.id)).forEach(m => delDoc('movs', m.id, true));
  const clave = m => [m.monto, m.metodo, m.fecha, m.cat, m.concepto].join('|');
  pagos.forEach(p => {
    p.concepto = concepto;
    const old = antes.find(m => m.id === p.id);
    if(!old || clave(old) !== clave(p)) putDoc('movs', p, true);
  });
  putDoc('encargos', enc);
  cerrarSheet(true);
  toast('Encargo #' + enc.num + ' guardado');
}

      '<div><label class="lbl" for="cbMonto">Monto que paga ahora</label>' +

function marcarEntregado(e){
  e.estado = 'entregado';
  e.tsEntrega = Date.now();
  putDoc('encargos', e);
  toast('Encargo #' + e.num + ' entregado');

function registrarCobro(id, metodo, entregar){
  const e = DATA.encargos.find(x => x.id === id);
  if(!e) return;
  const monto = soloNum($('#cbMonto').value);
  if(!monto){ toast('Poné cuánto pagó'); return; }
  const c = cuentaEnc(e);
  putDoc('movs', { id:uid(), tipo:'entrada', monto:monto, metodo:metodo, fecha:hoyISO(), ts:Date.now(),
                   cat:categoriaPago(c.total, c.pagado, monto), encargoId:e.id,
                   concepto:'Encargo #' + e.num + ' · ' + e.cliente }, true);

/* Acepta la configuración pegada tal cual la da Firebase: el bloque entero con
   los import, el objeto JS con las claves sin comillas, o JSON limpio. */
function parseConfigFirebase(txt){
  txt = String(txt || '').trim();
  if(!txt) return null;
  const k = txt.indexOf('firebaseConfig');
  const desde = txt.indexOf('{', k >= 0 ? k : 0);
  if(desde < 0) return null;
  const hasta = txt.indexOf('}', desde);
  if(hasta < 0) return null;
  const cuerpo = txt.slice(desde + 1, hasta);
  const out = {};
  const re = /["']?([A-Za-z_$][A-Za-z0-9_$]*)["']?\s*:\s*["']([^"']*)["']/g;
  let m;
  while((m = re.exec(cuerpo))) out[m[1]] = m[2];
  return (out.apiKey && out.projectId) ? out : null;
}

function exportarDatos(){
  const blob = new Blob([JSON.stringify({ v:1, app:'nerva', fecha:new Date().toISOString(), DATA:DATA }, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'nerva-' + hoyISO() + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function importarDatos(file){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const j = JSON.parse(fr.result);
      if(!j.DATA) throw new Error('formato');
      COLS.forEach(c => (j.DATA[c] || []).forEach(o => putDoc(c, o, true)));
      cerrarSheet(true); render(); toast('Datos importados');
    } catch(e){ toast('El archivo no es válido'); }
  };
  fr.readAsText(file);
}

/* ==================== SINCRONIZACIÓN (Firebase) ==================== */

const FB_VER = 'https://www.gstatic.com/firebasejs/10.12.2/';

/* Un cartel que solo dice "Error" no ayuda a nadie: se guarda el motivo real que
   devuelve Firestore y se traduce a algo accionable, que se lee en Ajustes. */
const MOTIVOS_FB = {
  'permission-denied': 'Firestore está rechazando la conexión. Casi siempre es que el código del negocio no coincide con el de las reglas, o que las reglas no se publicaron.',
  'unauthenticated':   'Firestore pide autenticación: revisá que las reglas sean las que corresponden a este código de negocio.',
  'not-found':         'No existe la base de datos. Creala en Firestore Database (ID (default)).',
  'failed-precondition':'Falta crear la base de datos en Firestore Database.',
  'unavailable':       'No hay conexión con Firestore. Puede ser internet o el servicio caído: reintenta solo.',
  'invalid-argument':  'Algún dato de la configuración de Firebase está mal.',
  'resource-exhausted':'Se pasaron de la cuota gratis del día. Se restablece sola.'
};

function anotarErrorCloud(e, donde){
  const code = (e && e.code) ? String(e.code).replace('firestore/', '') : '';
  CLOUD.error = {
    code: code || (e && e.message ? e.message.slice(0, 120) : 'desconocido'),
    msg: MOTIVOS_FB[code] || (e && e.message ? e.message : 'Error desconocido.'),
    donde: donde
  };
  console.warn('[sync]', donde, e);
  pintarSync('err', 'Error');
}

function pintarSync(estado, txt){
  if(estado !== 'err') CLOUD.error = null;
  const colores = { off:'bg-stone-500', on:'bg-ok', wait:'bg-warn animate-pulse', err:'bg-bad' };
  $('#syncDot').className = 'w-2 h-2 rounded-full ' + (colores[estado] || colores.off);
  $('#syncTxt').textContent = txt;
}

async function conectarCloud(silencioso){
  if(!CFG.fb || !CFG.negocioId){ pintarSync('off', 'Local'); return false; }
  pintarSync('wait', 'Conectando');
  try {
    const appMod = await import(FB_VER + 'firebase-app.js');
    const fs = await import(FB_VER + 'firebase-firestore.js');
    desconectarCloud(true);
    const app = appMod.getApps && appMod.getApps().length ? appMod.getApps()[0] : appMod.initializeApp(CFG.fb);
    CLOUD.db = fs.getFirestore(app);
    CLOUD.fns = fs;
    CLOUD.on = true;

    /* Al conectar un dispositivo que ya venía cargando solo, lo suyo no está en la
       nube y la suscripción lo pisaría. Se revisa antes y se pregunta. */
    if(!silencioso){
      const soloLocales = async col => {
        const snap = await fs.getDocs(fs.collection(CLOUD.db, 'negocios', CFG.negocioId, col));
        if(snap.empty) return { vacia:true, solos:[] };
        const enNube = {};
        snap.docs.forEach(d => enNube[d.id] = true);
        return { vacia:false, solos:DATA[col].filter(x => !enNube[x.id]) };
      };
      const res = {};
      for(const col of COLS) res[col] = await soloLocales(col);
      const n = res.encargos.solos.length + res.movs.solos.length;
      if(COLS.some(c => !res[c].vacia) && n){
        if(confirm('Este celular tiene ' + n + ' registros (encargos o movimientos de caja) que no están en la cuenta compartida.\n\n' +
                   'Aceptar: se suben y los ven todos.\n' +
                   'Cancelar: se descartan y queda lo que ya hay en la cuenta.')){
          COLS.forEach(c => res[c].solos.forEach(o => cloudPut(c, o)));
        }
      }
    }

    CLOUD.arrancada = {};
    COLS.forEach(col => {
      const ref = fs.collection(CLOUD.db, 'negocios', CFG.negocioId, col);
      const unsub = fs.onSnapshot(ref, snap => aplicarSnapshot(col, snap.docs.map(d => d.data())),
                                  err => anotarErrorCloud(err, 'leyendo ' + col));
      CLOUD.unsubs.push(unsub);
    });

    pintarSync('on', 'En línea');
    CFG.sincronizadoCon = CFG.negocioId;   /* de acá en adelante, la nube manda */
    saveLocal('config');
    if(!silencioso) toast('Sincronización activada');
    return true;
  } catch(e){
    CLOUD.on = false;
    anotarErrorCloud(e, 'conectando');
    if(!silencioso) toast('No se pudo conectar. Mirá el detalle en Ajustes.');
    return false;
  }
}

/* Configurar cada celular a mano se presta a errores de tipeo, así que la
   configuración viaja en un link. Quien lo abre queda conectado a la misma cuenta.
   El link lleva la llave del negocio: se manda solo a los del taller. */
function linkDeConfig(){
  const datos = btoa(unescape(encodeURIComponent(JSON.stringify({ fb:CFG.fb, n:CFG.negocioId }))));
  return location.origin + location.pathname + '#s=' + datos;
}

function aplicarConfigDeLink(){
  const h = location.hash || '';
  if(h.indexOf('#s=') !== 0) return false;
  try { history.replaceState(null, '', location.pathname + location.search); }
  catch(e){ location.hash = ''; }
  try {
    const d = JSON.parse(decodeURIComponent(escape(atob(h.slice(3)))));
    if(!d || !d.fb || !d.n) return false;
    if(CFG.negocioId === d.n && CFG.fb) return false;
    if(!confirm('¿Conectar este celular a Nerva?\n\nVas a ver los mismos encargos y la misma caja que el resto.')) return false;
    CFG.fb = d.fb;
    CFG.negocioId = d.n;
    saveLocal('config');
    return true;
  } catch(e){ return false; }
}

/* En iPhone, la app agregada a la pantalla de inicio guarda sus datos aparte de
   Safari: abre vacía y sin configurar. Llevando la config en el start_url, el
   acceso directo se configura solo la primera vez que se abre. */
let LINK_MANIFIESTO = null;
function actualizarManifiesto(){
  const base = location.href.replace(/[#?].*$/, '').replace(/[^/]*$/, '');
  const arranque = (CFG.fb && CFG.negocioId) ? linkDeConfig() : base;
  const manifest = {
    name:'Nerva · Encargos', short_name:'Nerva', start_url:arranque, display:'standalone',
    background_color:'#16110d', theme_color:'#16110d',
    icons:[{ src:base + 'icono.png', sizes:'512x512', type:'image/png', purpose:'any' }]
  };
  if(LINK_MANIFIESTO){ URL.revokeObjectURL(LINK_MANIFIESTO.href); LINK_MANIFIESTO.remove(); }
  LINK_MANIFIESTO = document.createElement('link');
  LINK_MANIFIESTO.rel = 'manifest';
  LINK_MANIFIESTO.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type:'application/json' }));
  document.head.appendChild(LINK_MANIFIESTO);
}

function parseLinkConfig(txt){
  const m = String(txt || '').match(/#s=([A-Za-z0-9+/=]+)/);
  if(!m) return null;
  try {
    const d = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    return (d && d.fb && d.n) ? d : null;
  } catch(e){ return null; }
}

function desconectarCloud(interno){
  CLOUD.unsubs.forEach(u => { try { u(); } catch(e){} });
  CLOUD.unsubs = [];
  CLOUD.arrancada = {};
  if(!interno){
    CLOUD.on = false; CLOUD.db = null; CLOUD.fns = null;
    pintarSync('off', 'Local');
  }
}

/* La subida de lo local solo tiene sentido la primera vez que este dispositivo se
   sincroniza con este negocio y encuentra la colección vacía. Si se hiciera en cada
   aviso, borrar el último registro lo resucitaría: los demás dispositivos verían la
   colección vacía y volverían a subir lo que todavía tienen en memoria. */
function aplicarSnapshot(col, docs){
  const primero = !CLOUD.arrancada[col];
  CLOUD.arrancada[col] = true;
  if(primero && !docs.length && DATA[col].length && CFG.sincronizadoCon !== CFG.negocioId){
    DATA[col].forEach(o => cloudPut(col, o));
    return 'subido';
  }
  DATA[col] = docs;
  saveLocal(col);
  render();
  return 'aplicado';
}

function cloudPut(col, obj){
  if(!CLOUD.on) return;
  const fs = CLOUD.fns;
  fs.setDoc(fs.doc(CLOUD.db, 'negocios', CFG.negocioId, col, obj.id), JSON.parse(JSON.stringify(obj)))
    .catch(e => anotarErrorCloud(e, 'guardando en ' + col));
}

function cloudDel(col, id){
  if(!CLOUD.on) return;
  const fs = CLOUD.fns;
  fs.deleteDoc(fs.doc(CLOUD.db, 'negocios', CFG.negocioId, col, id))
    .catch(e => anotarErrorCloud(e, 'borrando en ' + col));
}

document.addEventListener('click', ev => {
  const t = ev.target;
  const cl = sel => t.closest(sel);

  if(cl('a[href]')) return;   /* los links (WhatsApp) siguen solos */

  const tab = cl('[data-goto]');
  if(tab){ UI.tab = tab.dataset.goto; render(); window.scrollTo(0,0); return; }

  if(cl('#fab') || cl('#btnNuevoTop')){ nuevoSegunTab(); return; }
  if(cl('#btnAjustes') || cl('#btnSync')){ abrirAjustes(); return; }
  if(cl('#sheetClose') || t.id === 'overlay'){ cerrarSheet(); return; }

  if(cl('#btnDeshacer')){
    const fn = DESHACER;
    DESHACER = null;
    $('#toast').classList.add('hidden');
    if(fn) fn();
    return;
  }

  /* ---- lista de encargos ---- */
  const filtro = cl('[data-filtro]');
  if(filtro){ UI.filtro = filtro.dataset.filtro; render(); return; }

  const avanzar = cl('[data-avanzar]');
  if(avanzar){
    const e = DATA.encargos.find(x => x.id === avanzar.dataset.avanzar);
    if(!e) return;
    const sig = (ESTADOS[e.estado] || {}).next;
    if(sig === 'entregado'){ abrirCobro(e.id, true); return; }
    if(!sig) return;
    e.estado = sig;
    putDoc('encargos', e);
    toast('#' + e.num + ' · ' + ESTADOS[sig].txt + (sig === 'listo' && e.tel ? '. Avisale al cliente' : ''));
    return;
  }

  const cobrar = cl('[data-cobrar]');
  if(cobrar){ abrirCobro(cobrar.dataset.cobrar, false); return; }

  const cobro = cl('[data-cobro]');
  if(cobro){ const p = cobro.dataset.cobro.split('|'); registrarCobro(p[0], p[1], p[2] === '1'); return; }

  const sinCobrar = cl('[data-entregarsin]');
  if(sinCobrar){
    const e = DATA.encargos.find(x => x.id === sinCobrar.dataset.entregarsin);
    if(e){ cerrarSheet(true); marcarEntregado(e); }
    return;
  }

  const card = cl('[data-enc]');
  if(card){ abrirEncargo(card.dataset.enc); return; }

  /* ---- editor de encargo ---- */
  const b = UI.borrador;
  if(b){
    const addProd = cl('[data-addprod]');
    if(addProd){ addPieza(DATA.productos.find(p => p.id === addProd.dataset.addprod)); return; }
    if(cl('#btnAddPieza')){ addPieza(); return; }

    const delIt = cl('[data-delit]');
    if(delIt){ b.items.splice(Number(delIt.dataset.delit), 1); pintarItems(); pintarCuenta(); return; }

    const cant = cl('[data-cant]');
    if(cant){
      const p = cant.dataset.cant.split('|');
      const it = b.items[Number(p[0])];
      if(it){ it.cant = Math.max(1, (Number(it.cant) || 1) + Number(p[1])); pintarItems(); pintarCuenta(); }
      return;
    }

    const res = cl('[data-resina]');
    if(res){
      const p = res.dataset.resina.split('|');
      const it = b.items[Number(p[0])];
      if(!it) return;
      if(p[1] === '__otra'){
        const v = prompt('¿Qué color de resina?', it.resina && RESINAS.indexOf(it.resina) < 0 ? it.resina : '');
        if(v === null) return;
        it.resina = v.trim();
      } else it.resina = it.resina === p[1] ? '' : p[1];
      pintarItems();
      return;
    }

    const modo = cl('[data-modo]');
    if(modo){ b.entrega = modo.dataset.modo; pintarBorrador(); return; }

    const est = cl('[data-est]');
    if(est){ b.estado = est.dataset.est; pintarBorrador(); return; }

    const pgm = cl('[data-pgmonto]');
    if(pgm){ UI.pg.monto = pgm.dataset.pgmonto; pintarCuenta(); return; }

    const pgmet = cl('[data-pgmetodo]');
    if(pgmet){ UI.pg.metodo = pgmet.dataset.pgmetodo; pintarCuenta(); return; }

    if(cl('#btnAddPago')){ if(agregarPagoBorrador()) toast('Pago agregado. Acordate de guardar'); return; }

    const delPago = cl('[data-delpago]');
    if(delPago){ b.pagos = b.pagos.filter(p => p.id !== delPago.dataset.delpago); pintarCuenta(); return; }

    if(cl('#btnGuardarEnc')){ guardarEncargo(); return; }

    if(cl('#btnComprobante')){
      const txt = textoComprobante(b, b.pagos);
      if(b.tel) window.open(linkWa(b.tel, txt), 'whatsapp');
      else compartir(txt);
      return;
    }

    if(cl('#btnBorrarEnc')){
      const enc = DATA.encargos.find(x => x.id === b.id);
      if(!enc) return;
      const pagos = pagosDe(enc.id);
      const cobrado = pagos.reduce((s,m) => s + m.monto, 0);
      if(!confirm('¿Borrar el encargo #' + enc.num + ' de ' + enc.cliente + '?' +
                  (pagos.length ? '\n\nTambién se borran sus pagos de la caja (' + money(cobrado) + ').' : ''))) return;
      pagos.forEach(m => delDoc('movs', m.id, true));
      delDoc('encargos', enc.id);
      cerrarSheet(true);
      toastDeshacer('Encargo #' + enc.num + ' borrado', () => {
        pagos.forEach(m => putDoc('movs', m, true));
        putDoc('encargos', enc);
        toast('Encargo #' + enc.num + ' recuperado');
      });
      return;
    }
  }

  /* ---- caja ---- */
  const nm = cl('[data-nuevomov]');
  if(nm){ abrirMov(null, nm.dataset.nuevomov); return; }
  const mv = cl('[data-mov]');
  if(mv){ abrirMov(mv.dataset.mov); return; }

  if(UI.mov && $('#mvTipo')){
    const tp = cl('[data-mvtipo]');
    if(tp){ UI.mov.tipo = tp.dataset.mvtipo; UI.mov.cat = ''; pintarMov(); $('#sheetTitle').textContent = UI.mov.tipo === 'entrada' ? 'Nueva entrada' : 'Nuevo gasto'; return; }
    const ct = cl('[data-mvcat]');
    if(ct){ UI.mov.cat = ct.dataset.mvcat; pintarMov(); return; }
    const mt = cl('[data-mvmetodo]');
    if(mt){ UI.mov.metodo = mt.dataset.mvmetodo; pintarMov(); return; }
    if(cl('#btnGuardarMov')){ guardarMov(); return; }
    if(cl('#btnBorrarMov')){
      const m = DATA.movs.find(x => x.id === UI.mov.id);
      if(!m) return;
      delDoc('movs', m.id);
      cerrarSheet(true);
      toastDeshacer((m.tipo === 'entrada' ? 'Entrada' : 'Gasto') + ' de ' + money(m.monto) + ' borrado', () => { putDoc('movs', m); toast('Recuperado'); });
      return;
    }
  }

  if(cl('#btnCompartirMes')){ compartir(textoResumenMes(UI.mes)); return; }

  /* ---- productos ---- */
  if(cl('#btnNuevoProd')){ abrirProducto(); return; }
  const prod = cl('[data-prod]');
  if(prod){ abrirProducto(prod.dataset.prod); return; }
  const gp = cl('#prGuardar');
  if(gp){ guardarProducto(gp.dataset.prid); return; }
  const dp = cl('[data-delprod]');
  if(dp){
    const p = DATA.productos.find(x => x.id === dp.dataset.delprod);
    if(p && confirm('¿Borrar "' + p.nombre + '"? Los encargos ya cargados no cambian.')){
      delDoc('productos', p.id); cerrarSheet(true);
      toastDeshacer('Producto borrado', () => putDoc('productos', p));
    }
    return;
  }

  /* ---- ajustes ---- */
  if(cl('#cfConectar')){
    const desdeLink = parseLinkConfig($('#cfFb').value);
    if(desdeLink){
      CFG.fb = desdeLink.fb;
      CFG.negocioId = desdeLink.n;
    } else {
      CFG.negocioId = $('#cfNegocio').value.trim();
      const fb = parseConfigFirebase($('#cfFb').value);
      if(!fb) return toast('No encontré la config de Firebase en ese texto');
      CFG.fb = fb;
      if(!CFG.negocioId) return toast('Poné un código de negocio');
    }
    saveLocal('config');
    actualizarManifiesto();
    conectarCloud().then(ok => { if(ok) cerrarSheet(true); });
    return;
  }
  if(cl('#cfDesconectar')){ desconectarCloud(); cerrarSheet(true); toast('Sincronización desactivada'); return; }

  if(cl('#cfCompartir')){
    const url = linkDeConfig();
    abrirSheet('Conectar otro celular',
      '<div class="space-y-4">' +
        '<p class="text-sm text-stone-300 leading-snug">Mandale este link al celular o la compu que quieras sumar. Al abrirlo queda conectado a los mismos encargos y la misma caja, sin configurar nada.</p>' +
        '<div class="rounded-xl border border-nog-600 bg-nog-700 p-3 break-all font-mono text-[11px] text-stone-300">' + esc(url) + '</div>' +
        '<div class="grid grid-cols-2 gap-2">' +
          '<button type="button" id="cpCopiar" class="py-3 rounded-xl bg-mad-500 text-nog-900 font-extrabold text-sm active:scale-95 transition">Copiar link</button>' +
          '<a href="https://wa.me/?text=' + encodeURIComponent('Link para conectar la app de Nerva:\n' + url) + '" target="whatsapp" rel="noopener" class="py-3 rounded-xl border border-nog-600 font-bold text-sm text-center active:bg-nog-700 hover:bg-nog-700">Enviar por WhatsApp</a>' +
        '</div>' +
        '<p class="text-[11px] text-stone-500 leading-snug">Este link es la llave de la caja: mandalo solo a los del taller y no lo publiques en ningún lado.</p>' +
      '</div>', true);
    return;
  }
  if(cl('#cpCopiar')){
    const url = linkDeConfig();
    if(navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('Link copiado'), () => toast('No se pudo copiar'));
    else toast('Copialo a mano del recuadro');
    return;
  }
  if(cl('#cfExportar')){ exportarDatos(); return; }
  if(cl('#cfImportar')){ $('#cfFile').click(); return; }
  if(cl('#cfBorrarTodo')){
    if(confirm('¿Borrar TODOS los encargos y todos los movimientos de caja? No se puede deshacer.\n\nLos productos quedan.')){
      DATA.encargos.slice().forEach(e => delDoc('encargos', e.id, true));
      DATA.movs.slice().forEach(m => delDoc('movs', m.id, true));
      cerrarSheet(true); render(); toast('Listo, quedó todo limpio');
    }
    return;
  }
});

/* Lo que se escribe en el editor va directo al borrador, sin repintar los campos
   (repintar mientras se escribe hace perder el foco en el celular). */
document.addEventListener('input', ev => {
  const t = ev.target;
  const b = UI.borrador;
  if(t.id === 'q'){ UI.q = t.value; renderListaEnc(); return; }
  if(!b) return;
  if(t.dataset.b){
    b[t.dataset.b] = t.value;
    if(t.dataset.b === 'cliente'){
      const c = clientesConocidos().find(x => x.cliente.toLowerCase() === t.value.trim().toLowerCase());
      if(c && !b.tel && c.tel){ b.tel = c.tel; $('#enTel').value = c.tel; }
    }
    return;
  }
  if(t.dataset.it){
    const p = t.dataset.it.split('|');
    const it = b.items[Number(p[0])];
    if(!it) return;
    if(p[1] === 'precio'){ it.precio = soloNum(t.value); pintarCuenta(); return; }
    it[p[1]] = t.value;
    /* Al elegir un producto conocido, se sugiere su precio si no había uno. */
    if(p[1] === 'nombre' && !it.precio){
      const prod = DATA.productos.find(x => x.nombre.toLowerCase() === t.value.trim().toLowerCase());
      if(prod && prod.precio){
        it.precio = prod.precio;
        const ip = $('[data-it="' + p[0] + '|precio"]');
        if(ip) ip.value = prod.precio;
        pintarCuenta();
      }
    }
    return;
  }
  if(t.dataset.pg && UI.pg){
    UI.pg[t.dataset.pg] = t.value;
    if(t.dataset.pg === 'monto'){
      /* actualiza solo el título ("Registrar seña/saldo") sin perder el foco */
      const c = cuentaEnc(b, b.pagos);
      const lbl = $('#pgTitulo');
      if(lbl) lbl.textContent = 'Registrar ' + (soloNum(t.value) ? categoriaPago(c.total, c.pagado, soloNum(t.value)).toLowerCase() : (c.pagado > 0 ? 'otro pago' : 'seña'));
      $$('[data-pgmonto]').forEach(x => x.classList.toggle('on', Number(x.dataset.pgmonto) === soloNum(t.value)));
    }
  }
});

document.addEventListener('change', ev => {
  const t = ev.target;
  if(UI.borrador && t.dataset && t.dataset.b){ UI.borrador[t.dataset.b] = t.value; return; }
  if(UI.pg && t.dataset && t.dataset.pg === 'fecha'){ UI.pg.fecha = t.value; return; }
  if(ev.target.id === 'selMes'){ UI.mes = ev.target.value; renderCaja(); }
  if(ev.target.id === 'cfFile' && ev.target.files[0]) importarDatos(ev.target.files[0]);
});

/* ============================ INIT ============================ */

(function init(){
  loadLocal();
  window.addEventListener('hashchange', () => {
    if(aplicarConfigDeLink()){ render(); actualizarManifiesto(); conectarCloud(); }
  });
  const vinoDeLink = aplicarConfigDeLink();
  actualizarManifiesto();
  render();
  if(CFG.fb && CFG.negocioId) conectarCloud(!vinoDeLink); else pintarSync('off', 'Local');
})();
</script>
